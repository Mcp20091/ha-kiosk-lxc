# Home Assistant kiosk settings. Edit this file, nothing else.
# Base URLs: no trailing slash, no path.
HA_LOCAL_URL="http://homeassistant.local:8123"
HA_REMOTE_URL=""            # e.g. https://yourname.ui.nabu.casa (leave empty if none)

# Dashboard path only, e.g. "dashboard-wall/0" or "lovelace/home"
HA_DASHBOARD_PATH="CHANGE_ME"

# Host virtual terminal the kiosk draws on (host console stays on tty1)
KIOSK_VT=7

# --- Per-device settings (one copy of this file per kiosk device) ---
KIOSK_HOSTNAME="ha-kiosk"   # container hostname, e.g. ha-kiosk-xps, ha-kiosk-surface
KIOSK_ROTATION="auto"       # auto (accelerometer) | normal | left | right | inverted
KIOSK_SCALE=""              # UI zoom, e.g. 1.5 or 2 for high-DPI panels; empty = 1.0
KIOSK_OUTPUT=""             # display output name; empty = built-in panel (eDP/LVDS/DSI) if present
